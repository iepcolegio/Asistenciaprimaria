<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador y Editor de Excel Dinámico - Matriz de Asistencia</title>
    <!-- Librería SheetJS para leer y escribir Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #16a34a;
            --success-hover: #15803d;
            --print-color: #4b5563;
            --warning-color: #d97706;
            --warning-hover: #b45309;
            --info-color: #0284c7;
            --info-hover: #0369a1;
            --matrix-color: #6366f1;
            --matrix-hover: #4f46e5;
            --niveles-color: #0d9488;
            --niveles-hover: #0f766e;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }

        .file-input-wrapper {
            flex: 1;
            min-width: 250px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #btnSave { background-color: var(--success-color); }
        #btnSave:hover { background-color: var(--success-hover); }

        #btnPrint { background-color: var(--print-color); }
        #btnPrint:hover { background-color: #374151; }

        #btnFilter { background-color: var(--warning-color); }
        #btnFilter:hover { background-color: var(--warning-hover); }

        #btnResumen { background-color: var(--info-color); }
        #btnResumen:hover { background-color: var(--info-hover); }

        #btnMatriz { background-color: var(--matrix-color); }
        #btnMatriz:hover { background-color: var(--matrix-hover); }

        #btnNiveles { background-color: var(--niveles-color); }
        #btnNiveles:hover { background-color: var(--niveles-hover); }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: white;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .highlight-tarde {
            background-color: #fef3c7 !important;
        }

        .placeholder-text {
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-style: italic;
        }

        @media print {
            body * { visibility: hidden; }
            .container, .container * { visibility: visible; }
            .container { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; padding: 0; }
            .controls { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ASISTENCIAS DEL PERSONAL DE LA IEP 20125 NUESTRA SEÑORA DEL ROSARIO</h2>
        
        <div class="controls">
            <div class="file-input-wrapper">
                <label for="excelFile" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px;">Cargar archivo Excel:</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls">
            </div>
            
            <div class="btn-group">
                <button id="btnSave" onclick="guardarExcel()" disabled>Guardar</button>
                <button id="btnPrint" onclick="imprimirVentana()" disabled>Imprimir</button>
                <button id="btnFilter" onclick="toggleFiltro8AM()" disabled>Agrupar por Nombres</button>
                <button id="btnResumen" onclick="abrirVentanaResumen()" disabled>Ver Resumen por Días</button>
                <button id="btnMatriz" onclick="abrirMatrizAsistencia()" disabled>Matriz A/T/F</button>
                <button id="btnNiveles" onclick="abrirVentanaPorNiveles()" disabled>Por Niveles</button>
            </div>
        </div>

        <div class="table-responsive" id="tableContainer">
            <div class="placeholder-text">Sube un archivo de Excel para visualizar su contenido aquí.</div>
        </div>
    </div>

    <script>
        const nombresMap = {
            1: "Luis Angel Cortez Garcia", 2: "Pablo Echeandia Martinez", 3: "Crecencio Saavedra Ferrer",
            4: "Gianella Garcia Lam", 5: "Rosio Solis Mallma", 6: "Ruben Auris Pariona",
            7: "Carolina Paucar Yachi", 8: "Diego Guerra Rojas", 9: "Hilda Huapaya Manco",
            10: "Karina Campos Aburto", 11: "Felipe Chumpitaz Villalobos", 12: "Teodora Cortez de la Cruz",
            13: "Kathia Espinoza Falcon", 14: "Richard Calagua la Rosa", 15: "Jackeline Urbina Coronado",
            16: "Angelica Barrios Huaman", 17: "Benito Quispe Arias", 18: "Gerardo Yeren Bautista",
            19: "Doris Donayre Solis", 20: "Francisco Emerson Alvarez Holguin", 21: "Luz Ramos Garcia", 22: "Judith Pacheco Garcia",
            23: "Graciela Huasacca Albites", 24: "Nancy Valdivia Rodriguez", 25: "Francisco Quispe Toribio",
            26: "William Garcia Ramos", 27: "Adrian Coronel Torres", 28: "Luis Flores Palomino",
            29: "Maribel Francia Calagua", 30: "Raquel Avalos Chumpitaz"
        };

        const primariaIDs = [7, 8, 12, 15, 21, 23, 24, 25, 27, 28, 29, 30];

        const horariosDocentes = {
            "WILLIAM GARCIA RAMOS": { 1: "8:00", 2: "8:00", 3: "8:00", 4: "8:00", 5: "8:00" },
            "FRANCISCO EMERSON ALVAREZ HOLGUIN": { 1: "9:30", 2: "9:30", 3: "8:45", 4: "8:00", 5: "8:45" },
            "CRECENCIO SAAVEDRA FERRER": { 1: "8:00", 2: "8:00", 3: "8:00", 4: "8:00", 5: "8:00" },
            "RICHARD CALAGUA LA ROSA": { 1: "8:00", 2: "8:00", 3: "8:00", 4: "1:55", 5: "8:00" },
            "RUBEN AURIS PARIONA": { 1: "8:00", 2: "8:00", 3: "8:00", 4: "8:00", 5: "8:00" },
            "GERARDO YEREN BAUTISTA": { 2: "8:00", 3: "8:00", 4: "8:00", 5: "9:30" },
            "BENITO QUISPE ARIAS": { 1: "8:00", 5: "11:55" },
            "KATHIA ESPINOZA FALCON": { 1: "10:15", 2: "8:00", 3: "11:10", 4: "8:00", 5: "10:15" },
            "HILDA HUAPAYA MANCO": { 1: "9:30", 3: "11:10", 5: "9:30" },
            "ROSIO SOLIS MALLMA": { 3: "8:00", 4: "9:30", 5: "8:00" },
            "DORIS DONAYRE SOLIS": { 2: "10:15", 4: "10:15" },
            "PABLO ECHEANDIA MARTINEZ": { 1: "8:00", 3: "10:15" },
            "JUDITH PACHECO GARCIA": { 1: "10:15", 2: "11:10", 3: "10:15", 4: "10:15" }
        };

        let currentData = null;
        let filtroActivo = false;
        let mapaColoresFechas = {};
        const coloresDias = ["#dbeafe", "#dcfce7", "#f3e8ff", "#ffedd5", "#fee2e2", "#fef9c3", "#ccfbf1"];

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    let rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    let processedData = [];
                    mapaColoresFechas = {};

                    rawData.forEach((row, index) => {
                        if (index === 0) {
                            processedData.push(["ID", "Nombre", "Fecha", "Hora Real", "Valor"]);
                            return;
                        }

                        let originalCol0 = row[0];
                        let originalCol1 = row[1];
                        let originalCol3 = row[2];

                        let nombreFinal = nombresMap[originalCol0] ? nombresMap[originalCol0] : (originalCol0 !== undefined ? originalCol0 : "");

                        let horaRealStr = "";
                        if (originalCol3 instanceof Date) {
                            horaRealStr = originalCol3.toLocaleTimeString('es-PE', { 
                                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
                            });
                        } else {
                            horaRealStr = String(originalCol3 || "");
                        }

                        let fechaStr = originalCol1 instanceof Date ? originalCol1.toLocaleDateString() : String(originalCol1 || "");

                        if (fechaStr && !mapaColoresFechas[fechaStr]) {
                            mapaColoresFechas[fechaStr] = coloresDias[Object.keys(mapaColoresFechas).length % coloresDias.length];
                        }

                        processedData.push([index, nombreFinal, fechaStr, horaRealStr, originalCol3]);
                    });

                    currentData = processedData;
                    filtroActivo = false;
                    renderTable(currentData);

                    document.getElementById('btnSave').disabled = false;
                    document.getElementById('btnPrint').disabled = false;
                    document.getElementById('btnFilter').disabled = false;
                    document.getElementById('btnResumen').disabled = false;
                    document.getElementById('btnMatriz').disabled = false;
                    document.getElementById('btnNiveles').disabled = false;

                } catch (error) {
                    alert("Error al procesar el archivo Excel.");
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function esTardeGenerica(horaTexto) {
            if (!horaTexto) return false;
            let lower = String(horaTexto).toLowerCase();
            let partes = lower.replace(/am|pm|a\.m\.|p\.m\./g, '').trim().split(':');
            let hora = parseInt(partes[0]) || 0;
            let minuto = parseInt(partes[1]) || 0;
            if ((lower.includes('pm') || lower.includes('p.m.')) && hora < 12) hora += 12;
            if ((lower.includes('am') || lower.includes('a.m.')) && hora === 12) hora = 0;
            return (hora > 8 || (hora === 8 && minuto > 0));
        }

        function renderTable(data) {
            if (!data || data.length === 0) return;
            let html = '<table>';
            data.forEach((row, rowIndex) => {
                let esTardeRegistro = false;
                if (rowIndex > 0) {
                    esTardeRegistro = esTardeGenerica(row[3]);
                }
                let filaClase = esTardeRegistro ? 'class="highlight-tarde"' : '';
                html += `<tr ${filaClase}>`;

                row.forEach((cell, cellIndex) => {
                    const cellValue = (cell !== undefined && cell !== null) ? cell : '';
                    const tag = rowIndex === 0 ? 'th' : 'td';
                    let estiloCelda = "";
                    if (cellIndex === 2 && rowIndex > 0 && mapaColoresFechas[cell]) {
                        estiloCelda = `style="background-color: ${mapaColoresFechas[cell]}; font-weight: 500;"`;
                    }
                    html += `<${tag} ${estiloCelda}>${cellValue}</${tag}>`;
                });
                html += '</tr>';
            });
            html += '</table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function abrirVentanaPorNiveles() {
            if (!currentData || currentData.length <= 1) return;

            let filasDatos = currentData.slice(1);
            let datosPrimariaPorFecha = {};
            let datosSecundariaPorFecha = {};

            filasDatos.forEach(fila => {
                let nombreFila = fila[1];
                let fechaFila = fila[2];
                let idEncontrado = null;
                
                for (let id in nombresMap) {
                    if (nombresMap[id] === nombreFila) {
                        idEncontrado = parseInt(id);
                        break;
                    }
                }

                if (idEncontrado !== null && fechaFila) {
                    if (primariaIDs.includes(idEncontrado)) {
                        if (!datosPrimariaPorFecha[fechaFila]) datosPrimariaPorFecha[fechaFila] = [];
                        datosPrimariaPorFecha[fechaFila].push(fila);
                    } else {
                        if (!datosSecundariaPorFecha[fechaFila]) datosSecundariaPorFecha[fechaFila] = [];
                        datosSecundariaPorFecha[fechaFila].push(fila);
                    }
                }
            });

            let fechasUnicas = [...new Set([...Object.keys(datosPrimariaPorFecha), ...Object.keys(datosSecundariaPorFecha)])];
            fechasUnicas.sort((a, b) => {
                let partsA = a.split('/');
                let partsB = b.split('/');
                if (partsA.length === 3 && partsB.length === 3) {
                    return new Date(partsA[2], partsA[1]-1, partsA[0]) - new Date(partsB[2], partsB[1]-1, partsB[0]);
                }
                return new Date(a) - new Date(b);
            });

            const generarBloquesPorDia = (datosPorFecha, esPrimaria) => {
                if (Object.keys(datosPorFecha).length === 0) return '<p style="color: #64748b; font-style: italic;">No hay registros.</p>';
                
                let htmlAcumulado = '';
                fechasUnicas.forEach(fecha => {
                    let filasDia = datosPorFecha[fecha];
                    if (!filasDia || filasDia.length === 0) return;

                    htmlAcumulado += `<div class="dia-bloque">`;
                    htmlAcumulado += `<h4 class="fecha-titulo">📅 ${fecha}</h4>`;
                    htmlAcumulado += `<table><thead><tr><th>ID</th><th>Nombre</th><th>Hora Real</th></tr></thead><tbody>`;

                    filasDia.forEach(f => {
                        let horaStr = f[3];
                        let minutos = convertirHoraAMinutos(horaStr);
                        let estiloFila = '';

                        if (esPrimaria) {
                            // Primaria: <= 8:00 AM (480 minutos) en Verde, > 8:00 AM en Rojo
                            if (minutos <= 480) {
                                estiloFila = 'style="background-color: #f0fdf4; color: #16a34a; font-weight: bold;"'; // Verde
                            } else {
                                estiloFila = 'style="background-color: #fef2f2; color: #dc2626; font-weight: bold;"'; // Rojo
                            }
                        } else {
                            // Secundaria: Mantiene su alerta estándar de tardanza (> 8:00 AM)
                            let esTardeSec = esTardeGenerica(horaStr);
                            if (esTardeSec) {
                                estiloFila = 'style="background-color: #fef3c7;"';
                            }
                        }

                        htmlAcumulado += `<tr ${estiloFila}><td>${f[0]}</td><td>${f[1]}</td><td>${horaStr}</td></tr>`;
                    });

                    htmlAcumulado += `</tbody></table></div>`;
                });
                return htmlAcumulado;
            };

            let nuevaVentana = window.open('', '_blank', 'width=1300,height=800');
            nuevaVentana.document.write(`
                <html>
                <head>
                    <title>Asistencias por Niveles (Separados por Días)</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
                        h2 { text-align: center; color: #2563eb; margin-bottom: 25px; }
                        .container-grid { display: flex; gap: 20px; width: 100%; }
                        .columna-nivel { flex: 1; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); overflow-y: auto; max-height: 75vh; }
                        .titulo-nivel { margin-top: 0; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; font-size: 16px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: white; z-index: 5; }
                        .dia-bloque { margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; background: #ffffff; }
                        .fecha-titulo { margin: 0 0 8px 0; font-size: 14px; color: #475569; background: #f1f5f9; padding: 6px 10px; border-radius: 4px; }
                        table { width: 100%; border-collapse: collapse; font-size: 13px; }
                        th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
                        th { background: #f8fafc; color: #475569; }
                    </style>
                </head>
                <body>
                    <h2>REGISTROS DE ASISTENCIA SEPARADOS POR NIVELES Y DÍAS</h2>
                    <div class="container-grid">
                        <div class="columna-nivel">
                            <h3 class="titulo-nivel" style="color: #0d9488;">🏫 NIVEL PRIMARIA (Verde: ≤ 8am | Rojo: > 8am)</h3>
                            ${generarBloquesPorDia(datosPrimariaPorFecha, true)}
                        </div>
                        <div class="columna-nivel">
                            <h3 class="titulo-nivel" style="color: #7c3aed;">🎓 NIVEL SECUNDARIA</h3>
                            ${generarBloquesPorDia(datosSecundariaPorFecha, false)}
                        </div>
                    </div>
                </body>
                </html>
            `);
            nuevaVentana.document.close();
        }

        function convertirHoraAMinutos(horaStr) {
            if (!horaStr) return 0;
            let lower = String(horaStr).toLowerCase().trim();
            let partes = lower.replace(/am|pm|a\.m\.|p\.m\./g, '').trim().split(':');
            let hours = parseInt(partes[0]) || 0;
            let minutes = parseInt(partes[1]) || 0;

            let esPM = lower.includes('pm') || lower.includes('p.m.');
            let esAM = lower.includes('am') || lower.includes('a.m.');

            if (hours >= 1 && hours <= 6 && !esAM && !esPM) {
                if (hours < 7) {
                    hours += 12;
                }
            } else {
                if (esPM && hours !== 12) hours += 12;
                if (esAM && hours === 12) hours = 0;
            }

            return hours * 60 + minutes;
        }

        function abrirMatrizAsistencia() {
            if (!currentData || currentData.length <= 1) return;

            let fechasUnicas = [...new Set(currentData.slice(1).map(r => r[2]))].filter(Boolean);
            fechasUnicas.sort((a, b) => {
                let partsA = a.split('/');
                let partsB = b.split('/');
                if (partsA.length === 3 && partsB.length === 3) {
                    return new Date(partsA[2], partsA[1]-1, partsA[0]) - new Date(partsB[2], partsB[1]-1, partsB[0]);
                }
                return new Date(a) - new Date(b);
            });

            let registrosPorPersonaFecha = {};
            currentData.slice(1).forEach(fila => {
                let nombre = fila[1];
                let fecha = fila[2];
                let horaReal = fila[3];
                if (!nombre || !fecha) return;

                if (!registrosPorPersonaFecha[nombre]) registrosPorPersonaFecha[nombre] = {};
                if (!registrosPorPersonaFecha[nombre][fecha]) {
                    registrosPorPersonaFecha[nombre][fecha] = [];
                }
                registrosPorPersonaFecha[nombre][fecha].push(horaReal);
            });

            let asistenciaFinalMap = {};

            Object.keys(nombresMap).forEach(id => {
                let nombre = nombresMap[id];
                asistenciaFinalMap[nombre] = {};

                fechasUnicas.forEach(fecha => {
                    let partesF = fecha.split('/');
                    let fechaObj = partesF.length === 3 ? new Date(partesF[2], partesF[1]-1, partesF[0]) : new Date(fecha);
                    let diaSemana = fechaObj.getDay();

                    if (diaSemana === 0 || diaSemana === 6) return;

                    let nombreKey = Object.keys(horariosDocentes).find(k => nombre.toUpperCase().includes(k));
                    let horaProgramadaStr = null;
                    if (nombreKey && horariosDocentes[nombreKey][diaSemana]) {
                        horaProgramadaStr = horariosDocentes[nombreKey][diaSemana];
                    } else {
                        horaProgramadaStr = "8:00"; 
                    }

                    let minutosProgramados = convertirHoraAMinutos(horaProgramadaStr);
                    let marcasDia = registrosPorPersonaFecha[nombre] ? registrosPorPersonaFecha[nombre][fecha] : null;

                    if (!marcasDia || marcasDia.length === 0) {
                        asistenciaFinalMap[nombre][fecha] = { estado: 'F', hora: '-' };
                    } else {
                        marcasDia.sort((m1, m2) => convertirHoraAMinutos(m1) - convertirHoraAMinutos(m2));
                        let primeraMarca = marcasDia[0];
                        let minutosPrimeraMarca = convertirHoraAMinutos(primeraMarca);

                        if (minutosPrimeraMarca > minutosProgramados) {
                            asistenciaFinalMap[nombre][fecha] = { estado: 'T', hora: primeraMarca };
                        } else {
                            asistenciaFinalMap[nombre][fecha] = { estado: 'A', hora: primeraMarca };
                        }
                    }
                });
            });

            let listaPrimaria = [];
            let listaSecundaria = [];
            Object.keys(nombresMap).forEach(id => {
                let nombre = nombresMap[id];
                if (primariaIDs.includes(parseInt(id))) {
                    listaPrimaria.push(nombre);
                } else {
                    listaSecundaria.push(nombre);
                }
            });

            const diasSemanaNombres = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];

            const construirTablaMatriz = (docentesNivel, tituloNivel) => {
                let html = `<h3>${tituloNivel}</h3>`;
                html += `<div style="overflow-x: auto;"><table class="matriz-table">`;
                
                html += `<thead><tr><th style="background-color: #e2e8f0; text-align: center;">Día</th>`;
                fechasUnicas.forEach(f => {
                    let partesF = f.split('/');
                    let fechaObj = partesF.length === 3 ? new Date(partesF[2], partesF[1]-1, partesF[0]) : new Date(f);
                    let nombreDia = diasSemanaNombres[fechaObj.getDay()] || "";
                    html += `<th style="text-align: center; background-color: #f8fafc; font-size: 12px; color: #64748b;">${nombreDia}</th>`;
                });
                html += `</tr>`;

                html += `<tr><th>Docente</th>`;
                fechasUnicas.forEach(f => {
                    html += `<th>${f}</th>`;
                });
                html += `</tr></thead><tbody>`;

                docentesNivel.forEach(docente => {
                    html += `<tr><td style="font-weight: 600; white-space: nowrap;">${docente}</td>`;
                    fechasUnicas.forEach(f => {
                        let info = asistenciaFinalMap[docente] ? asistenciaFinalMap[docente][f] : null;
                        let marca = "";
                        let claseEstilo = "libre";

                        if (info) {
                            marca = info.estado;
                            if (marca === 'A') claseEstilo = 'asistio';
                            else if (marca === 'T') claseEstilo = 'tarde';
                            else if (marca === 'F') claseEstilo = 'falta';
                        }
                        
                        html += `<td class="${claseEstilo}" align="center" title="${info ? 'Primera marca: ' + info.hora : 'Sin programación'}"><b>${marca}</b></td>`;
                    });
                    html += `</tr>`;
                });

                html += `</tbody></table></div><br>`;
                return html;
            };

            let nuevaVentana = window.open('', '_blank', 'width=1200,height=800');
            nuevaVentana.document.write(`
                <html>
                <head>
                    <title>Matriz de Asistencia - A / T / F</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
                        h2 { text-align: center; color: #2563eb; }
                        h3 { background: #e2e8f0; padding: 8px 12px; border-radius: 6px; color: #334155; margin-top: 20px; }
                        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; font-size: 13px; }
                        th, td { border: 1px solid #cbd5e1; padding: 8px 10px; }
                        th { background: #f1f5f9; color: #475569; position: sticky; top: 0; }
                        .asistio { color: #16a34a; background-color: #f0fdf4; }
                        .tarde { color: #d97706; background-color: #fef3c7; }
                        .falta { color: #dc2626; background-color: #fef2f2; }
                        .libre { background-color: #f8fafc; color: #94a3b8; }
                        .leyenda { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; font-weight: 600; font-size: 14px; }
                        .leyenda span { padding: 6px 14px; border-radius: 4px; }
                    </style>
                </head>
                <body>
                    <h2>MATRIZ DE ASISTENCIA DOCENTE (Comparación con Horario Oficial)</h2>
                    <div class="leyenda">
                        <span class="asistio">A = Asistió a Tiempo (≤ Hora Programada)</span>
                        <span class="tarde">T = Tarde (> Hora Programada)</span>
                        <span class="falta">F = Falta (No marcó habiendo programación)</span>
                    </div>
                    ${construirTablaMatriz(listaPrimaria, "🏫 NIVEL PRIMARIA")}
                    ${construirTablaMatriz(listaSecundaria, "🎓 NIVEL SECUNDARIA")}
                </body>
                </html>
            `);
            nuevaVentana.document.close();
        }

        function guardarExcel() {
            if (!currentData) return;
            const newWs = XLSX.utils.aoa_to_sheet(currentData);
            newWs['!cols'] = [
                { wch: 10 }, { wch: 23 }, { wch: 15 }, { wch: 15 }, { wch: 23 }
            ];
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newWs, "Hoja1");
            XLSX.writeFile(newWb, "archivo_procesado.xlsx");
        }

        function imprimirVentana() {
            window.print();
        }

        function toggleFiltro8AM() {
            if (!currentData || currentData.length <= 1) return;
            const agrupado = currentData.slice(1).reduce((acc, fila) => {
                let nombre = fila[1];
                let minutos = convertirHoraAMinutos(fila[3]);
                let estado = 'TEMPRANO';
                let clase = 'temprano';
                if (minutos > 480) {
                    estado = 'TARDE';
                    clase = 'tarde';
                }
                if (!acc[nombre]) acc[nombre] = [];
                acc[nombre].push({ fecha: fila[2], hora: fila[3], estado: estado, clase: clase });
                return acc;
            }, {});

            let nuevaVentana = window.open('', '_blank', 'width=900,height=800');
            nuevaVentana.document.write(`
                <html>
                <head><style>
                    body { font-family: sans-serif; padding: 20px; }
                    .tarjeta-nombre { margin-bottom: 25px; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
                    table { width: 100%; border-collapse: collapse; }
                    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
                    .temprano { color: #059669; font-weight: bold; }
                    .tarde { color: #dc2626; font-weight: bold; }
                </style></head>
                <body>
                    <h2>Registros Agrupados por Nombre</h2>
                    ${Object.keys(agrupado).sort().map(nombre => `
                        <div class="tarjeta-nombre">
                            <h3>👤 ${nombre}</h3>
                            <table>
                                <tr><th>Fecha</th><th>Hora</th><th>Estado</th></tr>
                                ${agrupado[nombre].map(reg => `
                                    <tr class="${reg.clase}">
                                        <td>${reg.fecha}</td>
                                        <td>${reg.hora}</td>
                                        <td>${reg.estado}</td>
                                    </tr>
                                `).join('')}
                            </table>
                        </div>
                    `).join('')}
                </body>
                </html>
            `);
            nuevaVentana.document.close();
        }

        function abrirVentanaResumen() {
            if (!currentData || currentData.length <= 1) return;
            const resumen = currentData.slice(1).reduce((acc, fila) => {
                let fecha = fila[2];
                let minutos = convertirHoraAMinutos(fila[3]);
                let estado = (minutos > 480) ? 'tarde' : 'temprano';
                if (!acc[fecha]) acc[fecha] = [];
                acc[fecha].push({ nombre: fila[1], hora: fila[3], estado: estado });
                return acc;
            }, {});

            let nuevaVentana = window.open('', '_blank', 'width=800,height=800');
            nuevaVentana.document.write(`
                <html>
                <head><style>
                    body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
                    .bloque-dir { background: white; margin-bottom: 20px; padding: 15px; border-radius: 8px; border-left: 5px solid #4f46e5; }
                    h3 { margin-top: 0; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
                    .fila-persona { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
                    .temprano { color: #059669; font-weight: bold; }
                    .tarde { color: #dc2626; font-weight: bold; }
                </style></head>
                <body>
                    <h2>Resumen Detallado por Día</h2>
                    ${Object.keys(resumen).sort().map(fecha => `
                        <div class="bloque-dir">
                            <h3>📅 ${fecha}</h3>
                            ${resumen[fecha].map(p => `
                                <div class="fila-persona ${p.estado}">
                                    <span>${p.nombre}</span>
                                    <span>${p.hora}</span>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </body>
                </html>
            `);
            nuevaVentana.document.close();
        }
    </script>
</body>
</html>
