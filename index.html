<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Lateral</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f7f6;
        }

        /* Barra lateral izquierda */
        .sidebar {
            width: 260px;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 25px;
            color: #1abc9c;
            letter-spacing: 1px;
        }

        /* Botones de la barra lateral */
        .menu-btn {
            background-color: transparent;
            color: #bdc3c7;
            border: none;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background-color: #34495e;
            color: #ffffff;
            padding-left: 20px;
        }

        /* Estado activo del botón */
        .menu-btn.active {
            background-color: #1abc9c;
            color: #ffffff;
            font-weight: bold;
        }

        /* Área principal derecha */
        .content-area {
            flex: 1;
            display: flex;
            flex-czirection: column;
            background-color: #ffffff;
            position: relative;
        }

        /* Contenedor del Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Mensaje inicial cuando no se ha seleccionado nada */
        .welcome-message {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #7f8c8d;
            text-align: center;
            padding: 20px;
        }

        .welcome-message h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral -->
    <nav class="sidebar">
        <h2>IEP 20125 NUESTRA SEÑORA DEL ROSARIO</h2>
        <!-- Modifica los atributos 'data-url' con los enlaces que prefieras -->
        <button class="menu-btn" data-url="asistenciaprimaria.html">Asistencia Nivel Primario</button>
        <button class="menu-btn" data-url="https://iepcolegio.github.io/webrosario/paginas/asistencias2.html">Asistencia Nivel Secundario</button>
        <button class="menu-btn" data-url="#">Comportamiento</button>
        <button class="menu-btn" data-url="REGISTROBOLETAS.html">Boletas</button>
        <button class="menu-btn" data-url="https://news.google.com">Registro Tutoria</button>
        <button class="menu-btn" data-url="https://iepcolegio.github.io/secundaria20125/">Documentos</button>
    </nav>

    <!-- Área Derecha -->
    <main class="content-area">
        <div id="welcome" class="welcome-message">
            <h3>Bienvenido</h3>
            <p>Selecciona una opción del menú de la izquierda para visualizar el contenido aquí.</p>
        </div>
        <!-- Iframe oculto inicialmente -->
        <iframe id="viewer" style="display: none;" src=""></iframe>
    </main>

    <!-- JavaScript para manejar la interactividad -->
    <script>
        const buttons = document.querySelectorAll('.menu-btn');
        const viewer = document.getElementById('viewer');
        const welcome = document.getElementById('welcome');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                // Remover la clase 'active' de todos los botones y ponérsela al presionado
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                // Obtener el link del atributo data-url
                const url = button.getAttribute('data-url');

                // Ocultar mensaje de bienvenida y mostrar el iframe con la URL
                welcome.style.display = 'none';
                viewer.style.display = 'block';
                viewer.src = url;
            });
        });
    </script>

</body>
</html>
