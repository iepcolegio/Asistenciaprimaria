<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Asistencia</title>
    <style>
        /* --- ESTILOS GENERALES Y MENÚ PRINCIPAL --- */
        body { font-family: Arial, sans-serif; background: linear-gradient(to right, #1e3c72, #2a5298); text-align: center; color: white; margin: 0; padding: 0; min-height: 100vh; }
        .contenedor-menu { margin-top: 30px; display: block; }
        h1 { margin-top: 10px; font-size: 32px; }
        .caja-mes { background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 12px; width: 280px; margin: 20px auto 0 auto; border: 1px solid rgba(255, 255, 255, 0.3); }
        .caja-mes label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 16px; color: #ffcc00; }
        .select-mes-principal { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; color: #1e3c72; background: white; cursor: pointer; box-sizing: border-box; }
        .input-consolidado-menu { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: none; font-size: 14px; box-sizing: border-box; }
        .botones-menu { margin-top: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .boton-grado { width: 250px; padding: 12px; font-size: 18px; border-radius: 10px; background: #ffcc00; color: black; text-decoration: none; font-weight: bold; transition: 0.3s; border: none; cursor: pointer; }
        .boton-grado:hover { background: #ffaa00; transform: scale(1.05); }
        .boton-consolidado { background: #00ecb8; color: #03233c; margin-top: 5px; border: 2px solid white; }
        .boton-consolidado:hover { background: #00c499; }
        .boton-eliminar-mes { background: #dc3545; color: white; margin-top: 5px; border: 2px solid white; font-size: 15px; width: 250px; }
        .boton-eliminar-mes:hover { background: #bd2130; }

        /* --- ESTILOS DE LA SECCIÓN DE ASISTENCIA --- */
        .seccion-asistencia { display: none; background: #f2f2f2; color: black; padding: 20px; min-height: 100vh; box-sizing: border-box; text-align: left; }
        .seccion-asistencia h2 { text-align: center; margin-top: 10px; }
        .caja-fecha-registro { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px; }
        .grupo-input { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        .grupo-input label { font-weight: bold; font-size: 14px; color: #1e3c72; margin-bottom: 5px; }
        .grupo-input input { padding: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; }
        .input-bloqueado { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nombre { font-size: 18px; margin-bottom: 10px; font-weight: bold; word-break: break-word; }
        select { width: 100%; padding: 10px; border-radius: 8px; font-size: 16px; }
        .botones-asistencia { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-action { padding: 15px; border: none; border-radius: 10px; color: white; font-size: 17px; cursor: pointer; transition: 0.3s; font-weight: bold; text-align: center; }
        .btn-action:hover { opacity: 0.9; transform: scale(1.02); }
        .volver { background: #6c757d; margin-bottom: 15px; }
        .guardar { background: #28a745; }
        .nueva { background: #ff9800; }
        .exportar { background: #007bff; }
        .eliminar { background: #dc3545; }
    </style>
</head>
<body>

<div id="pantalla-menu" class="contenedor-menu">
    <img src="insignia3.jpg" width="100px" height="140px" onerror="this.src='insignia.jpg'" alt="Insignia">
    <h1>Asistencia Escolar Primario</h1>
    <div class="caja-mes">
        <label for="selector-mes">📅 SELECCIONAR MES DE TRABAJO:</label>
        <select id="selector-mes" class="select-mes-principal" onchange="actualizarMesActual()">
            <option value="MARZO">MARZO</option>
            <option value="ABRIL">ABRIL</option>
            <option value="MAYO" selected>MAYO</option>
            <option value="JUNIO">JUNIO</option>
            <option value="JULIO">JULIO</option>
            <option value="AGOSTO">AGOSTO</option>
            <option value="SETIEMBRE">SETIEMBRE</option>
            <option value="OCTUBRE">OCTUBRE</option>
            <option value="NOVIEMBRE">NOVIEMBRE</option>
            <option value="DICIEMBRE">DICIEMBRE</option>
        </select>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.3); margin: 15px 0;">
        <label style="color: #00ecb8; font-size: 14px;">📝 DATOS PARA EL CONSOLIDADO:</label>
        <input type="text" id="consolidado-docente" class="input-consolidado-menu" placeholder="Nombre del Docente" oninput="guardarDatosGlobales()">
        <input type="text" id="consolidado-area" class="input-consolidado-menu" placeholder="Área / Curso / Tutor" oninput="guardarDatosGlobales()">
    </div>
    <div class="botones-menu">
        <button class="boton-grado" onclick="abrirAsistencia('1° GRADO')">1° Grado</button>
        <button class="boton-grado" onclick="abrirAsistencia('2° GRADO')">2° Grado</button>
        <button class="boton-grado" onclick="abrirAsistencia('3° GRADO A')">3° Grado A</button>
        <button class="boton-grado" onclick="abrirAsistencia('3° GRADO B')">3° Grado B</button>
        <button class="boton-grado" onclick="abrirAsistencia('4° GRADO')">4° Grado</button>
        <button class="boton-grado" onclick="abrirAsistencia('5° GRADO A')">5° GRADO A</button>
        <button class="boton-grado" onclick="abrirAsistencia('5° GRADO B')">5° GRADO B</button>
        <button class="boton-grado" onclick="abrirAsistencia('6° GRADO A')">6° GRADO A</button>
        <button class="boton-grado" onclick="abrirAsistencia('6° GRADO B')">6° GRADO B</button>
        <button class="boton-grado boton-consolidado" onclick="abrirConsolidadoWeb()">📊 Consolidado General</button>
        <button class="boton-grado boton-eliminar-mes" onclick="eliminarMesCompleto()">🗑️ Eliminar Datos del Mes</button>
    </div>
</div>

<div id="pantalla-asistencia" class="seccion-asistencia">
    <button class="btn-action volver" onclick="volverAlMenu()">⬅ Volver al Menú</button>
    <p align="center"><img src="insignia.jpg" width="60" height="70" onerror="this.src='insignia3.jpg'" alt="Insignia pequeña"></p>
    <h2 id="titulo-grado">📚 Asistencia Escolar</h2>
    <div class="caja-fecha-registro">
        <div class="grupo-input">
            <label for="fecha-asistencia">📆 Fecha del Registro:</label>
            <input type="text" id="fecha-asistencia" placeholder="Ej: 11/05" onchange="cargarAsistenciaPorFecha()">
        </div>
        <div class="grupo-input">
            <label for="docente-asistencia">👨‍🏫 Docente / Profesor:</label>
            <input type="text" id="docente-asistencia" class="input-bloqueado" readonly placeholder="(Se define en el menú)">
        </div>
        <div class="grupo-input">
            <label for="area-asistencia">📖 Área / Curso:</label>
            <input type="text" id="area-asistencia" class="input-bloqueado" readonly placeholder="(Se define en el menú)">
        </div>
    </div>
    <div id="lista"></div>
    <div class="botones-asistencia">
        <button class="btn-action guardar" onclick="guardarAsistencia()">💾 Guardar Asistencia</button>
        <button class="btn-action nueva" onclick="nuevaAsistencia()">➕ Nueva Asistencia (Reiniciar Lista)</button>
        <button class="btn-action exportar" onclick="exportarVistaWeb()">📊 Ver Reporte / Imprimir</button>
        <button class="btn-action eliminar" onclick="eliminarHistorial()">🗑️ Eliminar Historial (Grado Activo)</button>
    </div>
</div>

<script>
    let gradoActual = "";
    let mesActual = "MAYO";
    let historial = [];
    const infoGeneral = { colegio: "IEP 20125 NUESTRA SEÑORA DEL ROSARIO", anio: "2026", nivel: "PRIMARIA" };
    const baseAlumnos = {
        "1° GRADO": ["ABURTO ABURTO IKER VALENTIN", "ABURTO YBAÑEZ ROSA LUCIANA", "ACUÑA GARCIA ALEXANDER JOSUE", "ACUÑA VILLALOBOS MICAELA","ARIAS VILLALOBOS DYLAN GABRIEL","BARRETO TERAN EMILY DAHANNA NATALIE","BERRU CALLE DILEMER ALEXIS","BRAVO CANDELA MAITE ALEJANDRINA","CAMPOS MERCADO GUADALUPE VALENTINA","CASTILLO NEYRA JUNIOR DANIEL", "CHAVEZ CUARESMA CATHLEEN GEORGHIANNA","COLLADO ARIAS FRANZHESCA LUANA","FLORES DELGADO AZLYN ADAYA","GARCIA FERNANDEZ NEIL ALEXANDER","LEVANO MATEO GIA XIMENA","PADILLA ARIAS RAFAELA LUCIA","PIZANGO FLORES CAROLINA DAILY","SOLIS GAMONAL MIA CATALEYA ALEXANDRA"],
        "2° GRADO": ["ANGULO RAMOS MARIANO ZAID", "ARANA TORRES MATEO JACK", "ARIAS VILLALOBOS MIA ALESANDRA", "AVALOS MATOS FACUNDO GABRIEL","AVALOS SOLER WALTER KALLED SELIM", "BLANCO PANTOJA CRISTOPHER OSEIAS", "CASTELL TENEMAS NAIM DARRELL", "FERNANDEZ VILLALOBOS YURIA LEIYA ELELY","HERNANDEZ BANDES MELANY SAMANTHA","LOPEZ ROMERO KALEV SANTIAGO","MALASQUEZ ARIAS MARIAN ARELY","MALASQUEZ AVALOS IAN JOSE","NUÑEZ ARIRAMA ISAAC MATEO","OCHOA QUISPE LIAN GAEL","QUISPE HERNANDEZ EIVY DAFNE","QUISPE RAMOS MARIA MAGDALENA","RODRIGUEZ ANGULO MAYHA ISABELL","TENEMAS ISLA LUCIANA VALENTINA","VILLALOBOS AVALOS ADRIANO MICHAEL","ZAMUDIO SANCHEZ EIME VALENTINA"],
        "3° GRADO A": ["ABARCA TERAN BRAYAM JHAIR", "ABARCA TERAN BRIYIT ODETH", "ABURTO PEREZ JIMENA LORENZA ", "ALVARO ARIAS ALEJANDRO BENJAMIN", "ARIAS RAMOS JONNY ABRAHAN","AVALOS DELGADO LOGAN MATEO","AVALOS HERRERA ALESSIA BRIANA","CAMPOS ARIAS ARIADNHY LUANETE","ESPINOZA AVALOS ANGEL WILDER","HUACHACA MARIANO SHAMIRA CRISTINA","MELGAR YAURICASA YAMILETH YASUMY","MELGAR YAURICASA YULEYMI ALIYETH","NAPAN ARIAS NOA ALVIERA","OSCCO RODRIGUEZ MILAN SEBASTIAN","PIGUAY DOMINGUEZ ANDREA ALEXANDRA","RAMOS RIVERA ALAANA FRANCCESCA","RIOS CARDENAS ASHLYE BRIZETH","RODRIGUEZ ABURTO KARIM AUGUSTO","VILLALOBOS ARIAS MATHIUS OCTAVIO"],
        "3° GRADO B": ["ABURTO OBANDO LUCAS LIAN", "ARIAS AVALOS ALEX JUNNIOR", "AVALOS CARDENAS ASTRID MIA", "AVALOS ESPINOZA DANEY KIUNMY","BERNAOLA ZAMUDIO MIKAEL ISAIAS","CHUMPITAZ DIAZ ALEXIA NIJHAN","HUAPAYA ANDRES NOAH","ROMERO PAREDES KATALEYA ISABEL VALENTINA","VICENTE QUISPE NICOLAS MOISES","VILCA ARIAS HUGO JUAN"],
        "4° GRADO": ["ABURTO ZAVALA KALESSIA BELEN", "ALCANTARA CHUMPITAZ IVANA LUCIANA", "ARONE AVALOS JEFRFERSON DEL PIERO", "CAMPOS AVALOS ROCIO DANNIA ", "CAMPOS HUAPAYA ALESSIO SANTIAGO", "CANDELA GARCIA CARLOS RAUL","CANDELA PEREZ CATALEYA YSABELLA","CARBAJAL RIVERA FERNANDA VALENTINA","CASILLA ARCOS SAORI VICTORIA","CHUCHON RAMOS JOSE LUIS","CHUMPITAZ LOPEZ MASIEL VICTORIA","CHUMPITAZ QUISPE LYAN VALENTINO","COLLADO ARIAS BRIANA KIYARI","HUAMANTUMBA ROMERO NAYELI ASHLY","LESCANO SANCHEZ SARITA KAORI","LUCENA SEVILLA AAROON ALEXANDER","MEZA CHUMPITAZ FERNANDA BEATRIZ","PISFIL FLORES EDEN DEL MILAGRO","QUISPE NIGLIO EMMANUEL SEBASTIAN","RAMOS ARIAS ALONDRA YAZMIN","SUAREZ AVALOS STEFANO ANDRE","VILLALOBOS AVALOS ALESSIA VALESZKA"],
        "5° GRADO A": ["ABURTO RAMOS SEBASTIAN JUSTO", "AGUILAR DIAZ LUIS DAN","AVALOS ESPINOZA MAYUMI MISHELL","BARRETO TERAN CRHISTOPHER JOSUE ","CARRILLO FIERRO NICK JUNIOR ","CHUMPITAZ CHUMPITAZ ANTONHY NICOLAS","CHUMPITAZ CISNEROS ALESHKA SHERYL","ESPINOZA AVALOS CARLOS EDUARD JUMPIO","FLORES RAMOS DAVID ALEPH","MORAN RIVAS TIZIANA VALENTINA","PALACIOS RAMOS ROUSSE YOALIBETH","PIZANGO FLORES RANDY FAVIAN","QUISPE HERNANDEZ EVANS GAEL","QUISPE PISFIL SOFIA YOVANA","RODRIGUEZ ANGULO FLAVIA CALESI","ROMERO DAVILA KEEFREN ALEXANDER","VILLALOBOS QUISPE FREDY ARTURO"],
        "5° GRADO B": ["AMABLE ROQUE OLGA YARUMI", "ARIAS ABURTO ALICIA ISABELLA","ARIAS SALINAS JHON ANTHONY LEYNER","CAMPOS BLANCO MARTHA ARASELI ","CANDELA RIOS LIAM BENJAMIN ","CHUMPITAZ BELEN DYLAM FABRICIO","CHUMPITAZ PAREDES ARIANA VICTORIA","CORDOVA GARCIA LUIS RAUL","FRANCIA RAMOS DIAGO DARIELL","HERNANDEZ VALDIVIA ANDREA MILETT","HUAMAN AVALOS RAQUEL MERILUZ","MALASQUEZ BARRIENTOS JUAN DE DIOS DIXON","MALASQUEZ GUARNIZ JOHAN LIONEL","PALENCIA LUCENA SANTHIAGO ENMANUEL","PEREZ RAMOS BRITANY BRIANNA LINET","QUISPE FRANCIA FRANCHESCA CECILIA","RAMOS PEREZ NATANIEL NILUFER","RIOS GARCIA LUZ JOHANA","VICENTE MALASQUEZ FABIAN SAID","VILCA ARIAS DELIA MAGDALENA VENUS","VILLALOBOS QUISPE MARIA DE LOS ANGELES"],
        "6° GRADO A": ["ABURTO OBANDO JUAN MATHIAS", "ABURTO QUISPE VALENTINA CRISTINA", "ALCANTARA CHUMPITAZ BENJAMIN JOSEPTH", "ARIAS AVALOS ALEJANDRA VALENTINA NOEMI","ARIAS CONDORI MIRTHA SOFIA","ARIAS VILLALOBOS DAYRON FROILAN","ARIAS VILLALOBOS SANTIAGO EMILIO","ARQUIÑEVA AVALOS MARIAPAZ ABIGAIL","AVALOS ORMACHEA NICOL VALENTINA","CAMACHO ABURTO DIEGO SEBASTIAN","CAMPOS ANCCO IKER ADHEMIR","CANCHARI RAMOS AKEMY KAORY","CHUMPITAZ CHUMPITAZ STEFANY MILAGROS","CHUMPITAZ DIAZ NIJASH JACOB","CHUMPITAZ LOPEZ JEAMSS AARON","DAVILA ZAVALA MATEO DAVID","ESCALANTE VERAMENDE PRISCILLA NAOMI","FRANCIA VIDAL EVANS EDUARDO","LOPEZ ROMERO ERICK SEBASTIAN CESAR","MALASQUEZ CARRILLO ARIANA GUADALUPE","NARRO ARIAS DAILA CARMELA","NARRO ARIAS ZAIRA LUISA","PISFIL FLORES CARLOS ISRAEL","RAMOS QUISPE MILET YIRHE","REYES ARIAS HAIANA VICTORIA ","RUBINO ABURTO LIAN MANUEL","RUIZ CASTELL ADRIANO MATHIAS","TASAYCO ROJAS HASABNA KERLY","TOMAS PULIDO DANNA PAOLA","VILLALOBOS VILLALOBOS SARASWATI DEVI"],
        "6° GRADO B": ["ABAD JIMENEZ YHOSTIN JHAIR ", "ABURTO YBAÑEZ ASHLEY BRIANNA", "ARANA TORRES VICTOR FELIX CLEMENTE", "BRAVO RAMOS ASTRID ARLYN","HERNANDEZ MAURICIO GIA VALENTINA","HUAMANTUMBA ROMERO EMILY SOLANGE","LEON CHUMPITAZ BRIANA KERLYM"]
    };
    const listaGrados = ["1° GRADO", "2° GRADO", "3° GRADO A", "3° GRADO B", "4° GRADO", "5° GRADO A", "5° GRADO B", "6° GRADO A", "6° GRADO B"];

    window.onload = function() {
        document.getElementById("consolidado-docente").value = localStorage.getItem("global_docente") || "";
        document.getElementById("consolidado-area").value = localStorage.getItem("global_area") || "";
    }

    function guardarDatosGlobales() {
        localStorage.setItem("global_docente", document.getElementById("consolidado-docente").value.trim());
        localStorage.setItem("global_area", document.getElementById("consolidado-area").value.trim());
    }

    function actualizarMesActual() { mesActual = document.getElementById("selector-mes").value; }

    function abrirAsistencia(grado) {
        gradoActual = grado;
        actualizarMesActual();
        document.getElementById("pantalla-menu").style.display = "none";
        document.getElementById("pantalla-asistencia").style.display = "block";
        document.getElementById("titulo-grado").innerText = `📚 Asistencia Escolar - ${grado} (${mesActual})`;
        document.getElementById("fecha-asistencia").value = "";
        let docenteGlobal = document.getElementById("consolidado-docente").value.trim();
        let areaGlobal = document.getElementById("consolidado-area").value.trim();
        document.getElementById("docente-asistencia").value = docenteGlobal || "No especificado";
        document.getElementById("area-asistencia").value = areaGlobal || "No especificado";
        historial = JSON.parse(localStorage.getItem(`historial_${gradoActual}_${mesActual}`)) || [];
        generarListaAlumnos();
    }

    function volverAlMenu() {
        document.getElementById("pantalla-asistencia").style.display = "none";
        document.getElementById("pantalla-menu").style.display = "block";
    }

    function generarListaAlumnos() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";
        const alumnos = baseAlumnos[gradoActual] || [];
        if(alumnos.length === 0) { lista.innerHTML = "<p style='text-align:center;'>No hay alumnos registrados.</p>"; return; }
        const fechaSeleccionada = document.getElementById("fecha-asistencia").value.trim();
        let registroExistente = historial.find(r => r.fecha === fechaSeleccionada);
        alumnos.forEach((alumno, index) => {
            let estadoGuardado = (registroExistente && registroExistente.datos && registroExistente.datos[alumno]) ? registroExistente.datos[alumno] : "A";
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="nombre">${index + 1}. ${alumno}</div>
            <select id="estado-${index}">
                <option value="A" ${estadoGuardado === 'A' ? 'selected' : ''}>✅ Asistió</option>
                <option value="F" ${estadoGuardado === 'F' ? 'selected' : ''}>❌ Faltó</option>
                <option value="T" ${estadoGuardado === 'T' ? 'selected' : ''}>⏰ Tarde</option>
            </select>`;
            lista.appendChild(card);
        });
    }

    function cargarAsistenciaPorFecha() { generarListaAlumnos(); }

    function guardarAsistencia() {
        let fecha = document.getElementById("fecha-asistencia").value.trim();
        if (!fecha) { alert("Ingrese una fecha."); return; }
        let asistencia = { fecha: fecha, docente: document.getElementById("docente-asistencia").value, area: document.getElementById("area-asistencia").value, datos: {} };
        baseAlumnos[gradoActual].forEach((alumno, i) => { asistencia.datos[alumno] = document.getElementById(`estado-${i}`).value; });
        let idx = historial.findIndex(r => r.fecha === fecha);
        if (idx !== -1) historial[idx] = asistencia; else historial.push(asistencia);
        localStorage.setItem(`historial_${gradoActual}_${mesActual}`, JSON.stringify(historial));
        alert("Guardado exitosamente.");
    }

    function nuevaAsistencia() {
        baseAlumnos[gradoActual].forEach((_, i) => { document.getElementById(`estado-${i}`).value = "A"; });
    }

    function eliminarHistorial() {
        if (confirm("¿Eliminar historial de este grado?")) {
            localStorage.removeItem(`historial_${gradoActual}_${mesActual}`);
            historial = [];
            generarListaAlumnos();
        }
    }

    function eliminarMesCompleto() {
        actualizarMesActual();
        if (confirm(`¿Eliminar TODO el historial de ${mesActual}?`)) {
            listaGrados.forEach(g => localStorage.removeItem(`historial_${g}_${mesActual}`));
            alert("Eliminado.");
        }
    }

    function exportarVistaWeb() {
        if (historial.length === 0) { alert("No hay datos."); return; }
        
        const alumnos = baseAlumnos[gradoActual] || [];
        const docente = document.getElementById("docente-asistencia").value;
        const area = document.getElementById("area-asistencia").value;

        let style = `
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; }
                table { border-collapse: collapse; width: 100%; font-size: 11px; margin-top: 10px; }
                th, td { border: 1px solid #999; padding: 4px; text-align: center; }
                .header-azul { background: #007bff; color: white; font-weight: bold; }
                .celda-A { background: #90EE90; }
                .celda-F { background: #FF7B7B; }
                .celda-T { background: #FFD966; }
                /* Colores de las columnas de totales */
                .col-total-asis { background: #d4edda; font-weight: bold; }
                .col-total-tard { background: #fff3cd; font-weight: bold; }
                .col-total-falt { background: #f8d7da; font-weight: bold; }
                .totales-row { font-weight: bold; background: #e9ecef; }
                .nombre-col { text-align: left !important; padding-left: 8px !important; }
                @media print { .no-print { display: none; } }
            </style>`;

        let tablaHTML = `<table><thead><tr class="header-azul"><th>N°</th><th>ALUMNO</th>`;
        historial.forEach(r => tablaHTML += `<th>${r.fecha}</th>`);
        tablaHTML += `<th class="col-total-asis">TOT Asis</th><th class="col-total-tard">TOT Tard</th><th class="col-total-falt">TOT Falt</th></tr></thead><tbody>`;

        let totalColAsis = new Array(historial.length).fill(0);
        let totalColTard = new Array(historial.length).fill(0);
        let totalColFalt = new Array(historial.length).fill(0);

        alumnos.forEach((alumno, i) => {
            let filaAsis = 0, filaTard = 0, filaFalt = 0;
            tablaHTML += `<tr><td>${i+1}</td><td class="nombre-col">${alumno}</td>`;
            
            historial.forEach((r, idx) => {
                let e = r.datos[alumno] || "A";
                if(e === "A") { filaAsis++; totalColAsis[idx]++; }
                else if(e === "T") { filaTard++; totalColTard[idx]++; }
                else if(e === "F") { filaFalt++; totalColFalt[idx]++; }
                tablaHTML += `<td class="celda-${e}">${e}</td>`;
            });
            
            tablaHTML += `<td class="col-total-asis">${filaAsis}</td>
                          <td class="col-total-tard">${filaTard}</td>
                          <td class="col-total-falt">${filaFalt}</td></tr>`;
        });

        let sumTotalAsis = totalColAsis.reduce((a, b) => a + b, 0);
        let sumTotalTard = totalColTard.reduce((a, b) => a + b, 0);
        let sumTotalFalt = totalColFalt.reduce((a, b) => a + b, 0);

        tablaHTML += `<tr class="totales-row"><td colspan="2" style="text-align:right;">TOTAL ASISTENCIAS (✅)</td>`;
        totalColAsis.forEach(v => tablaHTML += `<td class="col-total-asis">${v}</td>`);
        tablaHTML += `<td class="col-total-asis" colspan="3">${sumTotalAsis} Total</td></tr>`;

        tablaHTML += `<tr class="totales-row"><td colspan="2" style="text-align:right;">TOTAL TARDANZAS (⏰)</td>`;
        totalColTard.forEach(v => tablaHTML += `<td class="col-total-tard">${v}</td>`);
        tablaHTML += `<td class="col-total-tard" colspan="3">${sumTotalTard} Total</td></tr>`;

        tablaHTML += `<tr class="totales-row"><td colspan="2" style="text-align:right;">TOTAL FALTAS (❌)</td>`;
        totalColFalt.forEach(v => tablaHTML += `<td class="col-total-falt">${v}</td>`);
        tablaHTML += `<td class="col-total-falt" colspan="3">${sumTotalFalt} Total</td></tr>`;

        tablaHTML += `</tbody></table>`;

        const v = window.open("", "_blank");
        v.document.write(`<html><head>${style}</head><body>
            <div class="no-print" style="margin-bottom: 20px;">
                <button onclick="window.print()" style="padding:10px; cursor:pointer; background:#28a745; color:white; border:none; border-radius:5px;">🖨️ Imprimir / Guardar en PDF</button>
            </div>
            
            <div style="text-align: center; font-family: Arial, sans-serif; margin-bottom: 20px;">
                <h2 style="margin: 0;">${infoGeneral.colegio}</h2>
                <h3 style="margin: 5px 0;">NIVEL: ${infoGeneral.nivel}</h3>
            </div>

            <table style="width:100%; border:none; margin-bottom: 20px; font-size: 14px;">
                <tr>
                    <td style="text-align:left; border:none;"><strong>GRADO:</strong> ${gradoActual}</td>
                    <td style="text-align:center; border:none;"><strong>AÑO:</strong> ${infoGeneral.anio}</td>
                    <td style="text-align:right; border:none;"><strong>MES:</strong> ${mesActual}</td>
                </tr>
                <tr>
                    <td style="text-align:left; border:none; padding-top: 10px;"><strong>DOCENTE:</strong> ${docente}</td>
                    <td style="text-align:right; border:none; padding-top: 10px;" colspan="2"><strong>ÁREA / CURSO:</strong> ${area}</td>
                </tr>
            </table>

            ${tablaHTML}</body></html>`);
        v.document.close();
    }
    function abrirConsolidadoWeb() {
        actualizarMesActual();
        let datosConsolidados = listaGrados.map(grado => {
            let hG = JSON.parse(localStorage.getItem(`historial_${grado}_${mesActual}`)) || [];
            let A = 0, T = 0, F = 0;
            hG.forEach(r => Object.values(r.datos).forEach(e => { if(e==="A") A++; if(e==="T") T++; if(e==="F") F++; }));
            return { grado, A, T, F };
        });
        
        const v = window.open("", "_blank");
        v.document.write(`<html><head><script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script></head><body>
            <button onclick="window.print()">Imprimir</button>
            <canvas id="c"></canvas>
            <script>
                const data = ${JSON.stringify(datosConsolidados)};
                new Chart(document.getElementById('c'), {
                    type: 'bar',
                    data: { labels: data.map(d=>d.grado), datasets: [
                        {label:'Asist', data: data.map(d=>d.A), backgroundColor:'green'},
                        {label:'Tarde', data: data.map(d=>d.T), backgroundColor:'orange'},
                        {label:'Falta', data: data.map(d=>d.F), backgroundColor:'red'}
                    ]}
                });
            <\/script></body></html>`);
        v.document.close();
    }
</script>
</body>
